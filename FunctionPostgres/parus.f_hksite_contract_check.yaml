Schema: parus
Name: f_hksite_contract_check
Body: >
  CREATE OR REPLACE FUNCTION parus.f_hksite_contract_check(amount numeric)
   RETURNS boolean
   LANGUAGE plpgsql
  AS $function$

  BEGIN
      -- Учебное правило версии 1.2: сумма договора не меньше 100.
      RETURN amount >= 100;
  END;

  $function$
Grants:
- Grantee: PUBLIC
  Privilege: EXECUTE
Owner: parus
